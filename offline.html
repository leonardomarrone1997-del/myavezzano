<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>MyAvezzano offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f8fb;
        color: #07111f;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(520px, 100%);
        padding: 28px;
        border: 1px solid rgba(7, 17, 31, .12);
        border-radius: 18px;
        background: rgba(255, 255, 255, .88);
        box-shadow: 0 20px 70px rgba(7, 17, 31, .12);
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.8rem, 6vw, 2.8rem);
        line-height: 1;
      }
      p {
        margin: 0 0 18px;
        color: #42526a;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 18px;
        border-radius: 999px;
        background: #0f6bff;
        color: white;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>MyAvezzano</p>
      <h1>Sei offline.</h1>
      <p>La connessione non e' disponibile. Riapri la home quando torni online per aggiornare eventi, mappa e coupon.</p>
      <a href="/">Torna alla home</a>
    </main>
  </body>
</html>
